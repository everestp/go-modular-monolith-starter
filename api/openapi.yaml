openapi: 3.1.0
info:
  title: prod-go API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Healthy
  /readyz:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Ready
  /version:
    get:
      summary: Version metadata
      responses:
        "200":
          description: Application metadata
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required: [email, password]
      responses:
        "201":
          description: User created
  /api/v1/auth/login:
    post:
      summary: Login and receive a JWT
      responses:
        "200":
          description: Login successful
  /api/v1/auth/me:
    get:
      summary: Return the current user
      responses:
        "200":
          description: User profile
components: {}
