name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Go tools
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run
      - name: Vulnerability scan
        run: $(go env GOPATH)/bin/govulncheck ./...
      - name: Unit tests
        run: go test -race -shuffle=on ./...
      - name: Coverage report
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb?sslmode=disable
        run: go run ./cmd/migrate -- up
      - name: Repository integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb?sslmode=disable
        run: go test -race -shuffle=on -tags=integration ./internal/integration

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.3 lint api/openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build API and migration image
        run: docker buildx build --file deploy/Dockerfile --tag prod-go:ci --load .
      - name: Start stack and run E2E flow
        run: |
          docker compose -f deploy/docker-compose.yml up --build -d
          bash scripts/e2e.sh
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
